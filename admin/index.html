<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0b12" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Kitsu — пульт управления</title>
    <meta name="description" content="Шаблон админки Kitsu: каталог, очереди, парсер, стенд, люди и честные настройки" />
    <script>
      (() => {
        try {
          if (localStorage.getItem("kitsu-palette") === "obsidian") document.documentElement.dataset.palette = "obsidian";
          const saved = localStorage.getItem("kitsu-admin-theme");
          if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
        } catch (_) {}
      })();
    </script>
    <link rel="stylesheet" href="./styles.css?v=v4-1" />
  </head>
  <body>
    <a class="skip-link" href="#main">К содержимому</a>
    <div class="shell" id="shell">
      <nav class="rail" id="rail" aria-label="Разделы">
        <a class="rail-brand" href="#/pult" aria-label="Kitsu — пульт">
          <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M1.5 6.2c9 2.6 20 2.6 29 0l-1.3 4.6c-8.6 2.2-17.8 2.2-26.4 0z"/><path d="M6 13.4h20v2.6H6z"/><path d="M8.2 11h3v17.5h-3zM20.8 11h3v17.5h-3z"/></svg>
        </a>
        <div class="rail-list" id="rail-list"></div>
        <div class="rail-foot">
          <button type="button" class="rail-item" data-action="palette" aria-label="Сменить палитру">
            <i data-lucide="palette"></i><span data-palette-label>Сакура</span>
          </button>
          <button type="button" class="rail-item" data-action="theme" aria-label="Сменить тему">
            <i data-lucide="sun-moon"></i><span data-theme-label>Тёмная</span>
          </button>
        </div>
      </nav>

      <aside class="subnav" id="subnav" aria-label="Страницы раздела"></aside>

      <div class="main-col">
        <header class="topbar">
          <button type="button" class="icon-btn topbar-menu" data-action="subnav" aria-label="Открыть меню раздела" aria-controls="subnav" aria-expanded="false">
            <i data-lucide="panel-left"></i>
          </button>
          <nav class="crumbs" id="crumbs" aria-label="Где вы"></nav>
          <div class="topbar-spacer"></div>
          <a class="live-chip" id="live-chip" href="#/parser/jobs" hidden></a>
          <button type="button" class="search-trigger" data-action="cmdk" aria-label="Поиск и команды">
            <i data-lucide="search"></i><span>Найти тайтл, страницу, действие</span>
            <span class="kbd"><i data-lucide="command"></i>K</span>
          </button>
          <div class="me">
            <span class="me-avatar" aria-hidden="true">A</span>
            <div><strong>admin</strong><small>суперпользователь</small></div>
          </div>
        </header>
        <main id="main" tabindex="-1"></main>
      </div>

      <nav class="mobile-nav" id="mobile-nav" aria-label="Разделы"></nav>
    </div>

    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>
    <dialog class="dialog" id="confirm" aria-labelledby="confirm-title"></dialog>
    <dialog class="dialog cmdk" id="cmdk" aria-label="Поиск и команды"></dialog>
    <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>

    <script src="./vendor/lucide.min.js"></script>
    <script src="./data.js?v=v4-1"></script>
    <script src="./contracts.js?v=v4-1"></script>
    <script src="./app.js?v=v4-1"></script>
  </body>
</html>
