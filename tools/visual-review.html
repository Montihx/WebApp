<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Kitsu — проверка адаптивности</title>
<style>
body { margin:0; background:#303035; color:#fff; font:14px system-ui; }
header { min-height:56px; display:flex; flex-wrap:wrap; align-items:center; gap:16px; padding:0 16px; }
select { font:inherit; padding:6px; }
main { margin:auto; width:fit-content; transform-origin:top center; }
iframe { border:0; display:block; background:#0d0d0f; }
details { margin:8px 16px; }
pre { white-space:pre-wrap; font-size:12px; }
</style>
<header>
<label>Страница <select id="page"><option value="../public/index.html">Главная</option><option value="../public/anime.html">Тайтл</option><option value="../public/anime.html?title=steins-gate">Тайтл — связанные аниме</option><option value="../public/anime.html?title=steins-gate-movie">Тайтл — фильм</option><option value="../public/anime.html?title=steins-gate-0">Тайтл — альтернативная история</option><option value="../admin/index.html#/pult">Админка — пульт</option><option value="../admin/index.html#/catalog/titles">Тайтлы</option><option value="../admin/index.html#/catalog/import">Добавить из Kodik</option><option value="../admin/index.html#/catalog/episodes">Серии и источники</option><option value="../admin/index.html#/catalog/collections">Коллекции</option><option value="../admin/index.html#/queues/moderation">Модерация</option><option value="../admin/index.html#/queues/conflicts">Конфликты</option><option value="../admin/index.html#/queues/comments">Комментарии</option><option value="../admin/index.html#/parser/run">Запуск задач</option><option value="../admin/index.html#/parser/jobs">Задачи</option><option value="../admin/index.html#/parser/schedule">Расписание</option><option value="../admin/index.html#/parser/logs">Журнал парсера</option><option value="../admin/index.html#/parser/blacklist">Исключения</option><option value="../admin/index.html#/stand/checks">Проверки стенда</option><option value="../admin/index.html#/stand/resources">Ресурсы</option><option value="../admin/index.html#/stand/backups">Резервные копии</option><option value="../admin/index.html#/stand/audit">Журнал действий</option><option value="../admin/index.html#/people/users">Пользователи</option><option value="../admin/index.html#/people/access">Доступ</option><option value="../admin/index.html#/people/cosmetics">Оформление</option><option value="../admin/index.html#/settings">Настройки</option></select></label>
<label>Ширина <select id="width"><option>375</option><option>390</option><option>768</option><option selected>1440</option></select></label>
<label>Высота <select id="height"><option>900</option><option>1800</option><option selected>3400</option></select></label>
<label>Тема <select id="theme"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></label>
<output id="review-status" aria-live="polite">Загрузка…</output>
</header>
<details><summary>Размеры и служебные иконки</summary><pre id="layout-report"></pre></details>
<main><iframe title="Проверяемая страница" src="../public/index.html"></iframe></main>
<script>
const frame=document.querySelector('iframe');
const page=document.querySelector('#page');
const width=document.querySelector('#width');
const height=document.querySelector('#height');
const theme=document.querySelector('#theme');
const status=document.querySelector('#review-status');
let reviewObserver;
let pendingFrame;
function matchingOption(url) {
  const current = new URL(url);
  return [...page.options].find(option => {
    const candidate = new URL(option.value, location.href);
    return candidate.pathname === current.pathname && candidate.search === current.search && (!candidate.pathname.includes('/admin/') || candidate.hash === current.hash);
  });
}
function syncPage() {
  const option = matchingOption(frame.contentDocument.URL);
  if (!option) return false;
  page.value = option.value;
  status.textContent = option.textContent;
  return true;
}
function inspect(){
  const doc=frame.contentDocument, view=doc.defaultView;
  if (!doc.body || !matchingOption(doc.URL)) return;
  const boxes=[...doc.querySelectorAll('[class]')].filter(el =>
    el.tagName !== 'BUTTON' && typeof el.className === 'string' &&
    /(?:icon|glyph|symbol)/.test(el.className) && el.querySelector(':scope > svg') && el.getBoundingClientRect().width > 0
  ).map(el => ({class:el.className, background:view.getComputedStyle(el).backgroundColor, border:view.getComputedStyle(el).borderWidth}))
   .filter(el => el.background !== 'rgba(0, 0, 0, 0)' || el.border !== '0px');
  document.querySelector('#layout-report').textContent=JSON.stringify({
    page:page.selectedOptions[0].textContent,
    url:doc.URL,
    viewport:view.innerWidth,
    height:view.innerHeight,
    theme:doc.documentElement.dataset.theme,
    width:doc.documentElement.clientWidth,
    scrollWidth:doc.documentElement.scrollWidth,
    heading:doc.querySelector('h1')?.textContent.trim(),
    boxes,
  }, null, 2);
}
function applyTheme(){
  frame.contentDocument.documentElement.dataset.theme=theme.value;
  inspect();
}
async function ready(){
  const doc=frame.contentDocument;
  await doc.fonts.ready;
  if (doc !== frame.contentDocument || !syncPage()) return;
  applyTheme();
}
function size(){
  frame.width=width.value; frame.height=height.value;
  document.querySelector('main').style.zoom=Math.min(1,(innerWidth-32)/Number(width.value));
  inspect();
}
page.addEventListener('change',()=>{status.textContent='Загрузка…'; frame.src=page.value;});
frame.addEventListener('load',()=>{
  reviewObserver?.disconnect();
  cancelAnimationFrame(pendingFrame);
  const doc = frame.contentDocument;
  // The app renders after pushState/replaceState; these do not emit hashchange.
  // Observe the displayed view, not browser history APIs or app internals.
  reviewObserver = new MutationObserver(() => {
    cancelAnimationFrame(pendingFrame);
    pendingFrame = requestAnimationFrame(() => { if (doc === frame.contentDocument && syncPage()) inspect(); });
  });
  if (doc.body) reviewObserver.observe(doc.querySelector('#view-root') || doc.body, { childList:true, subtree:true });
  frame.contentWindow.addEventListener('hashchange',ready);
  frame.contentWindow.addEventListener('popstate',ready);
  ready();
});
theme.addEventListener('change',applyTheme);
width.addEventListener('change',size); height.addEventListener('change',size);
addEventListener('resize',size); size();
</script>
</html>
